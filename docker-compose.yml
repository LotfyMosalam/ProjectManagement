version: '3.9'

services:

  # ─────────────────────────────────────────────
  # API
  # ─────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=ProjectManagementDb;User=sa;Password=Your_strong_password123;TrustServerCertificate=True
      - ConnectionStrings__Redis=redis:6379
      - JwtSettings__Issuer=ProjectManagement.API
      - JwtSettings__Audience=ProjectManagement.Client
      - JwtSettings__Secret=super-secret-key-change-in-production-min-32-chars!
      - JwtSettings__ExpiryInMinutes=60
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
    restart: on-failure

  # ─────────────────────────────────────────────
  # SQL Server 2022
  # ─────────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=Your_strong_password123
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "Your_strong_password123" -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────────
  # Redis 7
  # ─────────────────────────────────────────────
  redis:
    image: redis:7
    ports:
      - "6379:6379"

# ─────────────────────────────────────────────
# Named volumes
# ─────────────────────────────────────────────
volumes:
  sql_data:
